<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid black background with rounded corners -->
  <rect width="512" height="512" rx="90" fill="#111111"/>

  <!-- GGS brand mark — two overlapping circles (G G) + square (S), gold -->
  <circle cx="162" cy="256" r="90" fill="none" stroke="#C4A96B" stroke-width="14"/>
  <circle cx="288" cy="256" r="90" fill="none" stroke="#C4A96B" stroke-width="14"/>
  <rect x="322" y="166" width="120" height="180" fill="none" stroke="#C4A96B" stroke-width="14"/>

  <!-- Letters inside each shape -->
  <text x="162" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82" fill="#C4A96B">G</text>
  <text x="288" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82" fill="#C4A96B">G</text>
  <text x="382" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="82" fill="#C4A96B">S</text>
</svg>
